<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝓛𝓪𝓶𝓫𝓸𝓻𝓰𝓱𝓲𝓷𝓲® Piano</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #2a2a2e 0%, #111113 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        .piano-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 1260px;
            height: 540px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(180deg, #2b2b2f 0%, #18181b 85%, #0d0d0f 100%);
            border: 2px solid #3f3f46;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                inset 0 2px 3px rgba(255, 255, 255, 0.15);
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 290px;
            padding: 35px 50px;
            position: relative;
            border-bottom: 6px solid #09090b;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .top-panel::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #7f1d1d, #dc2626, #7f1d1d);
        }

        .speaker {
            width: 240px;
            height: 180px;
            border-radius: 14px;
            background-color: #121214;
            background-image: radial-gradient(#27272a 1.5px, transparent 1.5px);
            background-size: 8px 8px;
            border: 1px solid #2e2e32;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.9);
        }

        .center-console {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .text {
            font-size: 42px;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #fef08a 0%, #eab308 50%, #a16207 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        /* Digital Display Screen */
        .display {
            background: #09090b;
            border: 1px solid #27272a;
            color: #eab308;
            font-family: monospace;
            font-size: 14px;
            padding: 6px 18px;
            border-radius: 6px;
            letter-spacing: 1px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 28px;
            background: #121214;
            padding: 14px 30px;
            border-radius: 50px;
            border: 1px solid #2c2c30;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444, 0 0 20px #dc2626;
        }

        .knob-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .knob-label {
            color: #71717a;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .knob {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #52525b, #18181b);
            border: 2px solid #09090b;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.7);
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .knob::after {
            content: "";
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 8px;
            background-color: #eab308;
        }

        .piano {
            display: flex;
            background-color: #09090b;
        }

        .key-out {
            width: 60px;
            height: 245px;
            background: linear-gradient(180deg, #e4e4e7 0%, #ffffff 15%, #f4f4f5 92%, #d4d4d8 100%);
            border: 1px solid #27272a;
            border-top: none;
            position: relative;
            border-radius: 0 0 6px 6px;
            box-shadow: inset 0 -4px 6px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: transform 0.05s ease, background 0.05s ease;
        }

        .key-out.active {
            transform: translateY(3px);
            background: linear-gradient(180deg, #d4d4d8 0%, #e4e4e7 100%);
        }

        .key-in {
            position: absolute;
            top: 0;
            right: -18px;
            width: 36px;
            height: 150px;
            background: linear-gradient(180deg, #27272a 0%, #09090b 88%, #3f3f46 100%);
            border: 1px solid #000;
            border-top: none;
            border-radius: 0 0 5px 5px;
            z-index: 2;
            box-shadow: 
                2px 5px 8px rgba(0, 0, 0, 0.6),
                inset 0 1px 2px rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .key-in.active {
            transform: translateY(3px);
            background: linear-gradient(180deg, #18181b 0%, #000000 100%);
        }
    </style>
</head>
<body>
    <div class="piano-container">
        <div class="top-panel">
            <div class="speaker"></div>
            
            <div class="center-console">
                <div class="text">𝓛𝓪𝓶𝓫𝓸𝓻𝓰𝓱𝓲𝓷𝓲®</div>
                <div class="display" id="note-display">READY • CLICK OR PRESS KEYS</div>
                <div class="controls">
                    <div class="led" title="Power"></div>
                    <div class="knob-group">
                        <div class="knob" id="vol-knob" title="Click to adjust Volume"></div>
                        <span class="knob-label">Vol</span>
                    </div>
                    <div class="knob-group">
                        <div class="knob" id="wave-knob" title="Click to switch Synth Tone"></div>
                        <span class="knob-label">Tone</span>
                    </div>
                    <div class="knob-group">
                        <div class="knob" id="sustain-knob" title="Click to toggle Sustain"></div>
                        <span class="knob-label">Sustain</span>
                    </div>
                </div>
            </div>

            <div class="speaker"></div>
        </div>

        <div class="piano" id="piano">
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"><div class="key-in"></div></div>
            <div class="key-out"></div>
        </div>
    </div>
    </body>
</html>
